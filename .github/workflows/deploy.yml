name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:   # permite rodar manualmente pelo GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout vault repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # necessário para datas de modificação corretas

      - name: Checkout Quartz
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: quartz/package-lock.json

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Copy vault content into Quartz
        run: |
          # Limpa o conteúdo padrão do Quartz
          rm -rf quartz/content/*

          # Copia as notas do vault (exceto arquivos de config do repo)
          rsync -av \
            --exclude='.git' \
            --exclude='.obsidian' \
            --exclude='quartz' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='CONTRIBUTING.md' \
            --exclude='LICENSE' \
            --exclude='.gitignore' \
            . quartz/content/

      - name: Copy custom Quartz config
        run: |
          cp quartz.config.ts quartz/quartz.config.ts

      - name: Build Quartz site
        working-directory: quartz
        run: npx quartz build

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
